# Deployment for demo-app. Environment-specific values (namespace, replicas,
# resources, image tag) are set by the overlays and by the pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  # Overlays set replicas equal to the HPA's minReplicas, so `kubectl apply`
  # never scales below what the HPA would choose anyway.
  replicas: 2
  revisionHistoryLimit: 5          # old ReplicaSets kept for `kubectl rollout undo`
  progressDeadlineSeconds: 120     # mark the rollout as failed if it makes no progress
  selector:
    matchLabels:
      app: demo-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                  # start one extra new pod at a time...
      maxUnavailable: 0            # ...and never remove an old pod before a new one is Ready
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      automountServiceAccountToken: false   # the app never talks to the K8s API
      securityContext:
        runAsNonRoot: true                  # kubelet refuses to start the pod as root
        runAsUser: 10001                    # matches the user in app/Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault              # default syscall filter
      containers:
        - name: demo-app
          # "demo-app" is a placeholder; the pipeline runs
          # `kustomize edit set image demo-app=<registry>/demo-app:<sha>-<build>`.
          image: demo-app
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: demo-app-config       # generated by kustomize (see kustomization.yaml)
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true    # app cannot write to its own image
            capabilities:
              drop: ["ALL"]
          resources:
            requests:                       # what the scheduler reserves
              cpu: 50m
              memory: 64Mi
            limits:                         # hard cap; over the memory limit = OOMKilled
              cpu: 250m
              memory: 128Mi
          readinessProbe:                   # failing = removed from Service endpoints
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                    # failing = container is restarted
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp                     # gunicorn needs a writable /tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
