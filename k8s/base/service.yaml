# ClusterIP Service: a stable in-cluster address that load-balances across
# Ready pods. Not exposed outside the cluster; the smoke test reaches it with
# `kubectl port-forward`.
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  labels:
    app: demo-app
  annotations:
    # For Prometheus setups that discover targets by annotation. The PodMonitor
    # example in docs/MONITORING.md does not need them.
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: http
