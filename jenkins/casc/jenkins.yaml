# ---------------------------------------------------------------------------
# Jenkins Configuration-as-Code (JCasC). Read at every controller start.
#
# ${VAR} values are environment variables passed by docker compose from .env
# (see .env.example). ${VAR:-default} supplies a default. Secrets are never
# written in this file:
#   - tokens/passwords come from environment variables
#   - kubeconfigs are read from files mounted at /run/secrets/ (docker compose secrets)
# ---------------------------------------------------------------------------
jenkins:
  systemMessage: "CI/CD demo: configured as code from jenkins/casc/jenkins.yaml. UI changes are overwritten on restart."
  numExecutors: 2            # demo builds run on the controller; see docs/SECURITY.md
  mode: NORMAL

  # Local user database with one admin, no self sign-up.
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  # Anonymous users see nothing; logged-in users can do everything.
  # Fine for a single-admin demo. For a team use matrix-auth or role-strategy (docs/SECURITY.md).
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  # CSRF protection (crumbs) is always on in current Jenkins; nothing to configure.
  # The /github-webhook/ endpoint is exempt by design and is protected by the webhook secret.

credentials:
  system:
    domainCredentials:
      - credentials:
          # GitHub PAT: branch-source API scans + commit status reporting.
          - usernamePassword:
              scope: GLOBAL
              id: github-token
              description: "GitHub fine-grained PAT (from .env)"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
          # Shared secret that GitHub uses to sign webhook payloads (HMAC SHA-256).
          - string:
              scope: GLOBAL
              id: github-webhook-secret
              description: "GitHub webhook secret (from .env)"
              secret: "${GITHUB_WEBHOOK_SECRET}"
          # One kubeconfig per cluster/environment, each tied to a least-privilege
          # ServiceAccount (k8s/rbac). Generated by local-setup/setup.sh.
          - file:
              scope: GLOBAL
              id: kubeconfig-dev
              description: "kubeconfig: jenkins-deployer in demo-dev"
              fileName: kubeconfig-dev
              secretBytes: "${readFileBase64:/run/secrets/kubeconfig-dev}"
          - file:
              scope: GLOBAL
              id: kubeconfig-prod
              description: "kubeconfig: jenkins-deployer in demo-prod"
              fileName: kubeconfig-prod
              secretBytes: "${readFileBase64:/run/secrets/kubeconfig-prod}"

security:
  # Job DSL scripts come only from the platform repo (protected branch, admins only),
  # so they run without the script-security sandbox. See docs/SECURITY.md.
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"

  # /prometheus/ metrics need a login: they reveal job names and build results.
  # Prometheus scrapes with basic auth (user + API token), see docs/MONITORING.md.
  prometheusConfiguration:
    useAuthenticatedEndpoint: true

  # Reject webhook deliveries that are not signed with the shared secret.
  gitHubPluginConfig:
    hookSecretConfigs:
      - credentialsId: github-webhook-secret

  # The shared library (vars/, src/, resources/ in the platform repo).
  # Global libraries run outside the Groovy sandbox ("trusted"), so only
  # reviewed, protected-branch code may live there.
  globalLibraries:
    libraries:
      - name: cicd-shared-lib
        defaultVersion: "${PLATFORM_REPO_BRANCH:-main}"
        implicit: false              # repos opt in with @Library('cicd-shared-lib') _
        allowVersionOverride: true   # lets you test a library branch: @Library('cicd-shared-lib@my-branch')
        includeInChangesets: false
        retriever:
          modernSCM:
            scm:
              git:
                remote: "${PLATFORM_REPO_URL}"

# The seed job: reads jenkins/seed/repos.yaml and creates/updates one
# Multibranch Pipeline per repo (jenkins/seed/seedJob.groovy).
# It polls the platform repo, so editing repos.yaml and pushing is all it takes
# to onboard a repo or cluster. Run it by hand once after the first start.
jobs:
  - script: |
      pipelineJob('seed-job') {
        description('Creates one Multibranch Pipeline per repo listed in jenkins/seed/repos.yaml. Managed by JCasC.')
        properties {
          disableConcurrentBuilds()
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('H/5 * * * *') }
            }
          }
        }
        definition {
          cps {
            sandbox(true)
            script('''
              node {
                stage('Checkout platform repo') {
                  git(url: '${PLATFORM_REPO_URL}', branch: '${PLATFORM_REPO_BRANCH:-main}')
                }
                stage('Generate jobs') {
                  def config = readYaml(file: 'jenkins/seed/repos.yaml')
                  jobDsl(targets: 'jenkins/seed/seedJob.groovy',
                         additionalParameters: [reposConfig: config],
                         removedJobAction: 'DISABLE',
                         removedViewAction: 'IGNORE',
                         lookupStrategy: 'JENKINS_ROOT')
                }
              }
            '''.stripIndent())
          }
        }
      }
