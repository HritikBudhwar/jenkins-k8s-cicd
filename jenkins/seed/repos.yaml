  #       - { environment: prod, cluster: prod-eu-gke, namespace: orders, credentialsId: kubeconfig-prod-eu }
  #       - { environment: prod, cluster: prod-us-gke, namespace: orders, credentialsId: kubeconfig-prod-us }
