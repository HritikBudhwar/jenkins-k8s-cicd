# ---------------------------------------------------------------------------
# Local demo: Jenkins controller + container registry.
#
# Start with `make up` (it runs `make cluster` checks and passes .env).
# Both containers join kind's Docker network "kind", so:
#   - Jenkins reaches the Kubernetes API at https://cicd-demo-control-plane:6443
#   - the kind node pulls images from this registry (container name kind-registry)
# The kind cluster must exist first, because the "kind" network is created by kind.
# ---------------------------------------------------------------------------
name: cicd-demo

services:
  registry:
    image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
    container_name: kind-registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"     # host (Docker daemon) pushes to localhost:5001
    volumes:
      - registry-data:/var/lib/registry
    networks: [kind]

  jenkins:
    build:
      context: ../jenkins
    image: cicd-demo/jenkins:local
    container_name: jenkins
    restart: unless-stopped
    env_file: ../.env              # admin user, GitHub token, repo URL (read by JCasC)
    ports:
      - "127.0.0.1:8080:8080"      # localhost only; expose via ngrok for webhooks
    # Builds run `docker build/push` through the host's Docker daemon.
    # SECURITY: access to docker.sock is root-equivalent on the host. Acceptable
    # on a laptop; in production use isolated build agents (docs/SECURITY.md).
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"         # group owning docker.sock inside containers (set by `make up`)
    # Kubeconfigs generated by setup.sh, mounted read-only at /run/secrets/<name>
    # and loaded into Jenkins credentials by JCasC.
    secrets:
      - kubeconfig-dev
      - kubeconfig-prod
    networks: [kind]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

secrets:
  kubeconfig-dev:
    file: ./.secrets/kubeconfig-dev
  kubeconfig-prod:
    file: ./.secrets/kubeconfig-prod

volumes:
  jenkins-home:
  registry-data:

networks:
  kind:
    external: true                 # created by `kind create cluster`
